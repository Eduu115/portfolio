server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json application/xml;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; include /etc/nginx/snippets/security-headers.conf; return 200 "ok"; }
  location /_astro/ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location ~* \.(woff2|png|jpg|webp|avif|svg|pdf)$ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
  location /es/ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri $uri.html $uri/index.html =404; error_page 404 /es/404.html; }
  location / { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; try_files $uri $uri.html $uri/index.html =404; }
  error_page 404 /404.html;
}
