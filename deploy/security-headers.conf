# add_header inside a location drops the server-level ones, so every location includes this file.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# script-src/style-src (with per-page hashes) come from the <meta> CSP that Astro writes into every page;
# frame-ancestors cannot be set from a <meta>, so it is sent here.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
